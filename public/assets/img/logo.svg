<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" width="260" height="70">
  <style>
    .deals { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 72px; fill: #0D6EFD; }
    .atr { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 72px; fill: #1A1A1A; }
    .sub { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 500; font-size: 22px; fill: #212529; }
  </style>
  <!-- Wordmark -->
  <text x="0" y="68" class="deals">deals</text>
  <text x="188" y="68" class="atr">atr</text>
  <!-- Percentage badge -->
  <circle cx="430" cy="48" r="42" fill="#0D6EFD"/>
  <text x="430" y="64" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="48" fill="#FFFFFF">%</text>
  <!-- Subtitle -->
  <text x="0" y="112" class="sub">Deals a tu rollo</text>
</svg>
