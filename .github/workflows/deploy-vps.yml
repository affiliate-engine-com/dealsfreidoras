name: Deploy to VPS (Traefik)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone ci4-base
        uses: actions/checkout@v4
        with:
          repository: affiliate-engine-com/ci4-base
          ref: v1.3.0
          path: base
          token: ${{ secrets.GHCR_PAT }}

      - name: Clone legal-pages
        uses: actions/checkout@v4
        with:
          repository: affiliate-engine-com/legal-pages
          ref: v1.0.0
          path: legal-pages
          token: ${{ secrets.LEGAL_PAGES_TOKEN || secrets.GHCR_PAT }}

      - name: Build pages
        run: python3 base/bin/build-pages.py --site . --legal legal-pages

      - name: Read config
        id: config
        run: |
          echo "domain=$(jq -r .domain site.config.json)" >> $GITHUB_OUTPUT
          echo "slug=$(jq -r .site_slug site.config.json)" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/affiliate-engine-com/dealsfreidoras:latest

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 161.22.47.170
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            mkdir -p /opt/sites/${{ steps.config.outputs.slug }}
            cat > /opt/sites/${{ steps.config.outputs.slug }}/docker-compose.yml << 'EOF'
            services:
              web:
                image: ghcr.io/affiliate-engine-com/dealsfreidoras:latest
                labels:
                  - "traefik.enable=true"
                  - "traefik.http.routers.${{ steps.config.outputs.slug }}.rule=Host(`${{ steps.config.outputs.domain }}`) || Host(`www.${{ steps.config.outputs.domain }}`)"
                  - "traefik.http.routers.${{ steps.config.outputs.slug }}.entrypoints=websecure"
                  - "traefik.http.routers.${{ steps.config.outputs.slug }}.tls.certresolver=letsencrypt"
                  - "traefik.http.routers.${{ steps.config.outputs.slug }}-http.rule=Host(`${{ steps.config.outputs.domain }}`) || Host(`www.${{ steps.config.outputs.domain }}`)"
                  - "traefik.http.routers.${{ steps.config.outputs.slug }}-http.entrypoints=web"
                  - "traefik.http.routers.${{ steps.config.outputs.slug }}-http.middlewares=${{ steps.config.outputs.slug }}-https"
                  - "traefik.http.middlewares.${{ steps.config.outputs.slug }}-https.redirectscheme.scheme=https"
                  - "traefik.http.middlewares.${{ steps.config.outputs.slug }}-https.redirectscheme.permanent=true"
                  - "traefik.http.services.${{ steps.config.outputs.slug }}.loadbalancer.server.port=80"
                restart: unless-stopped
            EOF
            cd /opt/sites/${{ steps.config.outputs.slug }}
            docker compose pull
            docker compose up -d
            docker network connect ${{ steps.config.outputs.slug }}_default traefik-traefik-1 || true
