name: Deploy to VPS (Traefik)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone ci4-base
        uses: actions/checkout@v4
        with:
          repository: affiliate-engine-com/ci4-base
          ref: v1.0.0
          path: base
          token: ${{ secrets.GHCR_PAT }}

      - name: Read config
        id: config
        run: |
          echo "domain=$(jq -r .domain site.config.json)" >> $GITHUB_OUTPUT
          echo "slug=$(jq -r .site_slug site.config.json)" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/affiliate-engine-com/dealsfreidoras:latest

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 161.22.47.170
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            mkdir -p /opt/sites/${{ steps.config.outputs.slug }}
            cat > /opt/sites/${{ steps.config.outputs.slug }}/docker-compose.yml << 'EOF'
            services:
              web:
                image: ghcr.io/affiliate-engine-com/dealsfreidoras:latest
                labels:
                  - "traefik.enable=true"
                  - "traefik.http.routers.${{ steps.config.outputs.slug }}.rule=Host(`${{ steps.config.outputs.domain }}`)"
                  - "traefik.http.routers.${{ steps.config.outputs.slug }}.entrypoints=websecure"
                  - "traefik.http.routers.${{ steps.config.outputs.slug }}.tls.certresolver=letsencrypt"
                  - "traefik.http.services.${{ steps.config.outputs.slug }}.loadbalancer.server.port=80"
                restart: unless-stopped
                networks:
                  - default
                  - traefik
            networks:
              traefik:
                external: true
                name: traefik_default
            EOF
            cd /opt/sites/${{ steps.config.outputs.slug }}
            docker compose pull
            docker compose up -d --force-recreate
